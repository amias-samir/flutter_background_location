group = "com.samir.flutter_background_location"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.9.24"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.6.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def agpMajorVersion =
        com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int

project.pluginManager.apply("com.android.library")

// AGP 9+ uses built-in Kotlin by default. Older Flutter/AGP hosts use KGP.
// Flutter's transitional AGP 9 template can explicitly opt out of built-in
// Kotlin; retain a fallback for those hosts until they remove that property.
def builtInKotlinExplicitlyDisabled =
        project.findProperty("android.builtInKotlin")?.toString()?.toBoolean() == false
def usesStandaloneKotlinPlugin = agpMajorVersion < 9 || builtInKotlinExplicitlyDisabled
if (usesStandaloneKotlinPlugin) {
    project.pluginManager.apply("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.samir.flutter_background_location"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    dependencies {
        implementation "androidx.core:core-ktx:1.13.1"
        implementation "com.google.android.gms:play-services-location:21.3.0"
        testImplementation "junit:junit:4.13.2"
    }
}

if (usesStandaloneKotlinPlugin) {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
} else {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}
