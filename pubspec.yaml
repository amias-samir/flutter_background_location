name: flutter_background_location_tracker
description: Durable foreground and background location tracking for Android and iOS with activity, mock-location signals, segmented storage, and export.
version: 0.1.0
repository: https://github.com/amias-samir/flutter_background_location
topics:
  - location
  - background-location
  - geolocation
  - activity-recognition
  - gps

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  uuid: ^4.6.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.samir.flutter_background_location
        pluginClass: FlutterBackgroundLocationPlugin
      ios:
        pluginClass: FlutterBackgroundLocationPlugin

  # To add assets to your package, add an assets section, like this:
