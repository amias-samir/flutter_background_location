  - code: permission_request_failed
    owner: TrackingPermissionStepException
    recovery: refresh
    redaction: no coordinates, route body, user ID, or organization ID
    commands:
      - requestNextPermission
  - code: active_track_conflict
    owner: TrackingException
    recovery: resume
    redaction: same-owner track ID only after scope verification
    commands:
      - startNewTrack
  - code: no_resumable_track
    owner: TrackingConflictException
    recovery: resume
    redaction: no coordinates, route body, user ID, or organization ID
    commands:
      - resumeCurrentTrack
  - code: owner_scope_conflict
    owner: TrackingException
    recovery: resolve_owner_capture
    redaction: no foreign track ID, user ID, or organization ID
    commands:
      - open
      - switchOwner
      - resolveOwnerScopeConflict
  - code: native_persistence_failed
    owner: TrackingException
    recovery: retry
    redaction: no coordinates, route body, user ID, or organization ID
    commands:
      - pauseCurrentTrack
      - completeCurrentTrack
      - native lifecycle commands
  - code: protocol_incompatible
    owner: TrackingException
    recovery: retry
    redaction: safe protocol versions and capability codes only
    commands:
      - native protocol negotiation
  - code: export_destination_unavailable
    owner: TrackingException
    recovery: retry
    redaction: display filename only
    commands:
      - exportTrack
  - code: export_storage_permission_required
