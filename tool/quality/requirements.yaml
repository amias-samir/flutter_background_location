schema_version: 1
package: flutter_background_location_tracker
compatibility:
  dart_api: 1
  native_protocol: 2
  route_database_schema: 11
  android_journal_schema: 2
  ios_journal_schema: 1
change_classifications:
  additive: "Adds an API, payload key, schema object, test, or documentation without removing supported behavior."
  behavior_tightening: "Narrows unsafe behavior while keeping the public symbol available."
  deprecated: "Keeps a public symbol available while steering callers to a replacement."
  breaking: "Requires source, binary, schema, or host configuration changes."
work_packages:
