      - test/fixtures/native_channel_v1.json
      - test/fixtures/exports/characterization_route.geojson
      - test/fixtures/exports/characterization_route.kml
      - test/fixtures/exports/characterization_route.gpx
  - id: F0-02
    phase: F0
    title: Traceability ledger and compatibility versions
    release_gate: requirement to evidence mapping exists
    required_before: multi-PR delivery
    evidence:
      - tool/quality/requirements.yaml
  - id: F0-03
    phase: F0
    title: Deterministic CI skeleton
    release_gate: package and platform baseline green
